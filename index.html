<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feliz Navidad 🎄</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="snow"></canvas>

  <header>
    <h1>Feliz Navidad 🎄✨</h1>

  </header>

  <div class="lights">
    <div class="wire" id="wire"></div>
  </div>

  <main class="container">
    <section class="card">
      <h2>Cuenta regresiva 🎁</h2>

      <div class="countdown">
        <div><span id="d">--</span><small>Días</small></div>
        <div><span id="h">--</span><small>Horas</small></div>
        <div><span id="m">--</span><small>Min</small></div>
        <div><span id="s">--</span><small>Seg</small></div>
      </div>

      <div class="buttons">
        <button id="btnSurprise">🎁 Sorpresa</button>
        <button id="btnNight">🌙 Modo noche</button>
        <button id="btnSnow">❄️ Pausar nieve</button>
      </div>

      <div id="toast" class="toast"></div>
    </section>
  </main>

  <footer>
    Hecho con ❤️ en Navidad
  </footer>

  <script src="script.js"></script>
</body>
</html>
